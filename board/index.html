<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Project board: a kanban view of the project's ROADMAP.md (format: FORMAT.md next to this page).
  The roadmap is the single source. This page reads it when it opens, every minute while it's on screen, and as
  soon as you come back to the tab; cards that changed column fly to their new column, with a short note.
  Columns come from each step's Status cell:
    On hold -> On hold · Done -> Done · In progress / being built / built, waiting / waiting for -> In progress
    Next -> Next · anything else (Not started, Planned) -> To do
  Open it through a web server from the project folder (python board/serve.py), not as a file.
  ?roadmap=path/to/ROADMAP.md reads another file (default: ../ROADMAP.md).
-->
<style>
    :root {
        --bg: #f3f1ec;
        --surface: #ffffff;
        --surface-2: #faf8f4;
        --ink: #1d2230;
        --muted: #646b78;
        --line: #e2ded5;
        --accent: #b8742e;
        --todo: #7b8494;
        --next: #2a78d6;
        --doing: #c98500;
        --done: #1a8f5f;
        --hold: #c4473c;
        --late: #c4473c;
        --soon: #b07400;
        --p0: #a0672b; --p1: #2a78d6; --p2: #eb6834; --p3: #6250d6;
        --p4: #1baf7a; --p5: #c2408f; --p6: #0f8a9d; --p7: #7a8a1f;
        --shadow: 0 1px 2px rgba(20, 24, 34, 0.06), 0 4px 14px rgba(20, 24, 34, 0.05);
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #10141d;
            --surface: #1a2030;
            --surface-2: #151a27;
            --ink: #eef0f4;
            --muted: #a3aab8;
            --line: #2a3142;
            --accent: #e0a35e;
            --todo: #8d96a6;
            --next: #3987e5;
            --doing: #d99a1a;
            --done: #2aa572;
            --hold: #e66767;
            --late: #ef7a7a;
            --soon: #e2a93a;
            --p0: #c98a4a; --p1: #3987e5; --p2: #d95926; --p3: #9085e9;
            --p4: #199e70; --p5: #e06aaf; --p6: #2bb3c6; --p7: #a3b43a;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #10141d;
        --surface: #1a2030;
        --surface-2: #151a27;
        --ink: #eef0f4;
        --muted: #a3aab8;
        --line: #2a3142;
        --accent: #e0a35e;
        --todo: #8d96a6;
        --next: #3987e5;
        --doing: #d99a1a;
        --done: #2aa572;
        --hold: #e66767;
        --late: #ef7a7a;
        --soon: #e2a93a;
        --p0: #c98a4a; --p1: #3987e5; --p2: #d95926; --p3: #9085e9;
        --p4: #199e70; --p5: #e06aaf; --p6: #2bb3c6; --p7: #a3b43a;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
        color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 Quicksand, system-ui, sans-serif;
        min-height: 100vh;
    }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 28px 16px 48px; }

    header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    h1 { margin: 0; font: 600 26px/1.1 "Josefin Sans", sans-serif; letter-spacing: 4px; text-transform: uppercase; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .top-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; margin-bottom: 20px; }
    .about {
        flex: 1 1 520px; max-width: 900px; padding: 14px 18px; border-radius: 16px;
        background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 14px;
    }
    .about[hidden] { display: none; }
    .about b { font-weight: 600; }
    .about .lead { margin: 0; font: 600 17px/1.45 Quicksand, sans-serif; }
    .about .more { margin: 10px 0 0; color: var(--muted); }
    .about .more p { margin: 8px 0 0; }
    .about summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 8px; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, .link {
        font: 500 13px Quicksand, sans-serif; color: var(--ink); background: var(--surface);
        border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; text-decoration: none;
        min-height: 36px; display: inline-flex; align-items: center; gap: 6px;
    }
    button:hover, .link:hover { border-color: var(--accent); }
    button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    /* Schedule: the project's dates, today, and each phase's stretch of time */
    .timeline {
        flex: 1 1 420px; padding: 14px 18px; border-radius: 16px; background: var(--surface);
        border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px;
    }
    .timeline[hidden] { display: none; }
    .tl-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; align-items: baseline; }
    .tl-head b { font: 600 13px "Josefin Sans", sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    .tl-head .muted { color: var(--muted); }
    .tl-state { font-weight: 600; }
    .tl-state.late { color: var(--late); }
    .tl-state.ok { color: var(--done); }
    .tl-track { position: relative; height: 26px; margin: 12px 0 4px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
    .tl-phase {
        position: absolute; top: 3px; bottom: 3px; border-radius: 6px; background: color-mix(in srgb, var(--phase) 26%, transparent);
        border: 1px solid color-mix(in srgb, var(--phase) 60%, transparent); font-size: 11px; font-weight: 600;
        color: var(--ink); padding: 0 6px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
    .tl-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .tl-work { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .tl-work .meter { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .tl-work .meter i { display: block; height: 100%; background: var(--done); border-radius: 3px; }

    /* Phase progress */
    .phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .phase {
        background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--phase); border-radius: 16px;
        padding: 12px 16px 14px; box-shadow: var(--shadow);
    }
    .phase .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .phase b { font-weight: 600; }
    .phase .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .phase .dates { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bar { display: flex; gap: 2px; height: 8px; margin-top: 10px; }
    .bar i { flex: 1; border-radius: 4px; background: var(--line); }
    .bar i.done { background: var(--done); }
    .bar i.doing { background: var(--doing); }
    .bar i.next { background: var(--next); }
    .bar i.hold { background: var(--hold); }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
    .filters span { color: var(--muted); font-size: 13px; margin-right: 4px; }

    /* Board */
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; align-items: start; }
    @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .board { grid-template-columns: minmax(0, 1fr); } }
    .col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; padding: 12px; min-height: 120px; }
    .col h2 {
        margin: 2px 4px 12px; font: 600 13px "Josefin Sans", sans-serif; letter-spacing: 2px; text-transform: uppercase;
        display: flex; align-items: center; gap: 8px;
    }
    .col h2 .dot { width: 10px; height: 10px; border-radius: 50%; }
    .col h2 .n { margin-left: auto; color: var(--muted); font-weight: 400; letter-spacing: 0; }
    .empty { color: var(--muted); font-size: 13px; padding: 4px 6px 8px; }

    /* Wide screens: the page stays the window's size and each column scrolls on its own */
    @media (min-width: 1101px) {
        .wrap { height: 100vh; display: flex; flex-direction: column; padding-bottom: 16px; }
        .wrap > :not(.board) { flex: none; }
        .board { flex: 1; min-height: 240px; align-items: stretch; }
        .col { display: flex; flex-direction: column; min-height: 0; padding-right: 6px; }
        .col h2 { flex: none; }
        .col .cards { flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
        footer { margin-top: 12px; }
    }

    .card {
        background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--phase);
        border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow);
    }
    .card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
    .chip.phase { color: var(--phase); border-color: var(--phase); font-weight: 600; }
    .due { font-weight: 600; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); }
    .due.late { color: var(--late); border-color: var(--late); background: color-mix(in srgb, var(--late) 10%, transparent); }
    .due.soon { color: var(--soon); border-color: var(--soon); }
    .due.done { color: var(--done); border-color: color-mix(in srgb, var(--done) 50%, transparent); }
    .card h3 { margin: 6px 0 4px; font-size: 15px; font-weight: 600; line-height: 1.35; }
    .card .status { font-size: 12px; color: var(--muted); margin: 0; }
    .card .status strong { color: var(--ink); }
    .card details { margin-top: 8px; }
    .card summary { cursor: pointer; font-size: 13px; color: var(--accent); list-style: none; }
    .card summary::-webkit-details-marker { display: none; }
    .card summary::before { content: "▸ "; }
    .card details[open] summary::before { content: "▾ "; }
    .card .desc { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
    .card .desc b { color: var(--ink); font-weight: 600; }
    .card code { font-size: 12px; background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
    .note { margin-top: 8px; padding: 8px 10px; border-radius: 10px; font-size: 12px; background: color-mix(in srgb, var(--hold) 12%, transparent); }

    .parts { list-style: none; margin: 8px 0 0; padding: 0; }
    .parts li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 4px 0; border-top: 1px dashed var(--line); }
    .parts li:first-child { border-top: 0; }
    .parts .pdot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; }
    .parts .pid { flex: none; font-weight: 600; min-width: 26px; }
    .parts .ptxt { color: var(--muted); }
    .parts .pst { display: block; font-size: 12px; color: var(--ink); }
    .parts .pdue { font-size: 11px; margin-left: 4px; }
    .parts .pdue.late { color: var(--late); font-weight: 600; }

    .s-todo { --c: var(--todo); } .s-next { --c: var(--next); } .s-doing { --c: var(--doing); }
    .s-done { --c: var(--done); } .s-hold { --c: var(--hold); }
    .dot, .pdot { background: var(--c); }

    /* A card moving to another column, and its landing glow */
    .card.flying {
        position: fixed; z-index: 50; margin: 0; pointer-events: none;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    .card.arrived { animation: arrived 2.4s ease-out; }
    @keyframes arrived {
        0%, 35% { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
        100% { box-shadow: 0 0 0 3px transparent, var(--shadow); }
    }

    #toast {
        position: fixed; right: max(16px, calc((100vw - 1500px) / 2 + 16px)); top: 104px; z-index: 60;
        max-width: min(460px, calc(100vw - 32px));
        display: flex; flex-direction: column; gap: 2px; padding: 12px 18px; border-radius: 14px;
        background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--shadow);
        opacity: 0; transform: translateY(-12px); pointer-events: none;
        transition: opacity .3s ease, transform .3s ease;
    }
    #toast.show { opacity: 1; transform: none; }
    #toast b { font-size: 14px; font-weight: 600; }
    #toast span { opacity: 0.85; }
    @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

    .error { padding: 16px; border-radius: 14px; border: 1px solid var(--hold); background: var(--surface); }
    footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1 id="title">Project board</h1>
            <p class="sub" id="sub">Reading the roadmap…</p>
        </div>
        <div class="tools">
            <button id="refresh" type="button" title="Read the roadmap again">↻ Refresh</button>
            <button id="theme" type="button" title="Light or dark">◐ Theme</button>
            <a class="link" id="roadmap-link" href="../ROADMAP.md" target="_blank" rel="noopener">ROADMAP.md</a>
        </div>
    </header>

    <div class="top-row">
        <div class="about" id="about" hidden></div>
        <section class="timeline" id="timeline" aria-label="Schedule" hidden></section>
    </div>
    <section class="phases" id="phases" aria-label="Progress by phase"></section>
    <div class="filters" id="filters"></div>
    <main class="board" id="board"></main>
    <footer>This board is a view of ROADMAP.md: change the roadmap and the board follows (it rereads it every minute while open, and as soon as you come back to this tab).</footer>
</div>

<script>
const COLUMNS = [
    { id: "todo", label: "To do" },
    { id: "next", label: "Next" },
    { id: "doing", label: "In progress" },
    { id: "done", label: "Done" },
    { id: "hold", label: "On hold" },
];
const PALETTE = 8;   // phase colours --p0..--p7, in the order the phases appear
const ROADMAP = new URLSearchParams(location.search).get("roadmap") || "../ROADMAP.md";
document.getElementById("roadmap-link").href = ROADMAP;

// A status cell -> a column
function columnOf(status) {
    const s = status.replace(/\*/g, "").toLowerCase().trim();
    if (s.includes("on hold")) return "hold";
    if (/^done\b/.test(s)) return "done";
    if (/in progress|being built|built, waiting|waiting for/.test(s)) return "doing";
    if (/^next\b/.test(s)) return "next";
    return "todo";
}

const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// The little markdown the roadmap uses: **bold** and `code`
const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");

// ---------- Dates (YYYY-MM-DD, local days) ----------
const ISO = /\b(\d{4})-(\d{2})-(\d{2})\b/;
function dateOf(text) {
    const m = String(text || "").match(ISO);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function today() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
const DAY = 86400000;
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const short = (d) => d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
const long = (d) => d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });

// ---------- The roadmap (see FORMAT.md) ----------
// Table columns are found by their header names, so the Due column is optional
const HEAD = {
    id: /^(#|id|step|part|no\.?)$/, text: /^(feature|task|what|step name|title|description)$/,
    effort: /^(effort|size|estimate)$/, due: /^(due|target|deadline|date|due date)$/, status: /^(status|state)$/,
};
const STEP_ID = /^[A-Z]?\d+$/;          // 1, 12, F3
const PART_ID = /^[A-Z]?\d+[a-z]$/;     // 9a, F3b

function parse(text) {
    const lines = text.split(/\r?\n/);
    const phases = [];       // { id, title, index }
    const steps = new Map(); // id -> step
    const parts = [];        // { parent, id, text, status, due }
    const holdNotes = {};    // step id -> paragraph
    let phase = null;
    let title = "";
    let updated = "";
    let schedule = null;     // { start, end, days, raw }
    const about = [];        // paragraphs of "## About the project": the first is the short description
    let inAbout = false;
    let para = "";
    let cols = null;         // the current table's column map
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!title) {
            const t = line.match(/^#\s+(.+?)\s*$/);
            if (t) title = t[1].replace(/\s*[-–:·]?\s*(project\s+)?roadmap\s*$/i, "").trim() || t[1];
        }
        const u = line.match(/Last updated ([^.]+)\./);
        if (u) updated = u[1];
        // "**Schedule:** start 2026-10-20 · end 2026-12-18 · ..."
        const sc = line.match(/^\**Schedule:?\**:?\s*(.*)$/i);
        if (sc) {
            const start = dateOf((sc[1].match(/start\D*(\d{4}-\d{2}-\d{2})/i) || [])[1]);
            const end = dateOf((sc[1].match(/end\D*(\d{4}-\d{2}-\d{2})/i) || [])[1]);
            if (start && end) schedule = { start, end, raw: sc[1] };
            continue;
        }
        if (/^## About the project/i.test(line)) {
            inAbout = true;
            continue;
        }
        if (inAbout) {
            if (!line.trim() || /^#/.test(line)) {
                if (para) about.push(para);
                para = "";
                if (/^#/.test(line)) inAbout = false;
                else continue;
            } else {
                para += (para ? " " : "") + line.trim();
                continue;
            }
        }
        const h = line.match(/^## Phase ([0-9A-Z]+):\s*(.+)$/);
        if (h) {
            phase = { id: h[1], title: h[2].replace(/\s*\(.*\)\s*$/, ""), index: phases.length };
            phases.push(phase);
            cols = null;
            continue;
        }
        if (/^#{1,2} /.test(line)) phase = null;
        // "Step 10 is **on hold**. ..." paragraphs
        const hold = line.match(/^Step ([A-Z]?\d+) is \*\*on hold\*\*/);
        if (hold) {
            let p = line;
            while (lines[i + 1] && lines[i + 1].trim()) p += " " + lines[++i].trim();
            holdNotes[hold[1]] = p;
            continue;
        }
        if (!line.trim().startsWith("|")) {
            if (line.trim()) cols = null;
            continue;
        }
        const cells = line.trim().split("|").slice(1, -1).map((c) => c.trim());
        if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;   // the separator row
        // A header row (the row above a separator) sets the column map
        if (/^\|\s*:?-{2,}/.test((lines[i + 1] || "").trim())) {
            cols = {};
            cells.forEach((c, k) => {
                const name = c.replace(/\*/g, "").toLowerCase().trim();
                for (const [key, re] of Object.entries(HEAD)) if (re.test(name) && cols[key] === undefined) cols[key] = k;
            });
            continue;
        }
        if (!phase || !cols || cols.id === undefined || cols.status === undefined) continue;
        const get = (key) => (cols[key] === undefined ? "" : cells[cols[key]] ?? "");
        const id = get("id");
        const textCell = get("text");
        if (STEP_ID.test(id) && cols.text !== undefined) {
            const m = textCell.match(/^\*\*(.+?)\*\*\s*(.*)$/);
            steps.set(id, {
                n: id, phase: phase.id,
                title: (m ? m[1] : textCell).replace(/\.$/, ""),
                desc: m ? m[2] : "",
                effort: get("effort"), status: get("status"), due: dateOf(get("due")),
                col: columnOf(get("status")), parts: [],
            });
        } else if (PART_ID.test(id)) {
            parts.push({ parent: id.replace(/[a-z]$/, ""), id, text: textCell, status: get("status"), due: dateOf(get("due")), col: columnOf(get("status")) });
        }
    }
    if (para && inAbout) about.push(para);
    for (const p of parts) steps.get(p.parent)?.parts.push(p);
    for (const [n, note] of Object.entries(holdNotes)) if (steps.has(n)) steps.get(n).holdNote = note;
    for (const s of steps.values()) s.doneOn = s.col === "done" ? dateOf(s.status) : null;
    return { title, phases, steps: [...steps.values()], updated, about, schedule };
}

let data = null;
let phaseFilter = "all";
const phaseColor = (id) => {
    const p = data.phases.find((x) => x.id === id);
    return `var(--p${(p ? p.index : 0) % PALETTE})`;
};

// The due chip of a step: done (with the day it was finished), late, soon, or the date
function dueChip(s) {
    if (s.col === "done") {
        const d = s.doneOn || s.due;
        return d ? `<span class="due done" title="Done">✓ ${short(d)}</span>` : "";
    }
    if (!s.due) return "";
    const left = daysBetween(today(), s.due);
    if (s.col === "hold") return `<span class="due" title="Due ${long(s.due)} (on hold)">Due ${short(s.due)}</span>`;
    if (left < 0) return `<span class="due late" title="Was due ${long(s.due)}">Overdue · ${-left} d</span>`;
    if (left === 0) return `<span class="due soon" title="Due ${long(s.due)}">Due today</span>`;
    if (left <= 3) return `<span class="due soon" title="Due ${long(s.due)}">Due in ${left} d</span>`;
    return `<span class="due" title="Due ${long(s.due)}">Due ${short(s.due)}</span>`;
}

const isLate = (s) => s.due && s.col !== "done" && s.col !== "hold" && daysBetween(today(), s.due) < 0;

// moved: step id -> { title, from, to } for the cards that changed column since the last read
function render(moved = new Map()) {
    const { title, phases, steps, updated, about, schedule } = data;
    document.getElementById("title").textContent = title ? `${title} board` : "Project board";
    document.title = title ? `${title} board` : "Project board";
    const aboutEl = document.getElementById("about");
    aboutEl.hidden = !about.length;
    const open = aboutEl.querySelector("details")?.open ?? false;
    aboutEl.innerHTML = about.length
        ? `<p class="lead">${md(about[0])}</p>` + (about.length > 1
            ? `<details${open ? " open" : ""}><summary>About the project</summary><div class="more">${about.slice(1).map((t) => `<p>${md(t)}</p>`).join("")}</div></details>`
            : "")
        : "";
    const late = steps.filter(isLate);
    document.getElementById("sub").textContent =
        `${steps.filter((s) => s.col === "done").length} of ${steps.length} steps done`
        + (late.length ? ` · ${late.length} overdue` : "")
        + (updated ? ` · roadmap updated ${updated}` : "");

    renderTimeline(schedule, phases, steps, late);

    // Phase progress: one segment per step, coloured by its column; the phase's dates when it has them
    const ph = document.getElementById("phases");
    ph.replaceChildren(...phases.map((p) => {
        const mine = steps.filter((s) => s.phase === p.id);
        const done = mine.filter((s) => s.col === "done").length;
        const dues = mine.map((s) => s.due).filter(Boolean);
        const span = phaseSpan(p, phases, steps, schedule);
        const el = document.createElement("div");
        el.className = "phase";
        el.style.setProperty("--phase", phaseColor(p.id));
        el.innerHTML = `<div class="top"><b>Phase ${esc(p.id)} · ${esc(p.title)}</b><span class="count">${done} / ${mine.length}</span></div>`
            + (dues.length && span ? `<div class="dates">${short(span.from)} → ${short(span.to)}${mine.some(isLate) ? ` · <span style="color: var(--late)">${mine.filter(isLate).length} overdue</span>` : ""}</div>` : "")
            + `<div class="bar" role="img" aria-label="${done} of ${mine.length} steps done">`
            + mine.map((s) => `<i class="${s.col === "todo" ? "" : s.col}" title="${esc(s.n)}. ${esc(s.title)}: ${esc(s.status.replace(/\*/g, ""))}${s.due ? ` · due ${long(s.due)}` : ""}"></i>`).join("")
            + `</div>`;
        return el;
    }));

    // Phase filter
    const f = document.getElementById("filters");
    f.innerHTML = `<span>Show</span>`;
    for (const id of ["all", ...phases.map((p) => p.id)]) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = id === "all" ? "All phases" : `Phase ${id}`;
        b.setAttribute("aria-pressed", String(phaseFilter === id));
        b.onclick = () => { phaseFilter = id; render(); };
        f.append(b);
    }

    // Columns
    const board = document.getElementById("board");
    // Each column keeps its scroll position when the board is rebuilt (the roadmap is reread every minute)
    const scrolled = {};
    for (const l of board.querySelectorAll(".col .cards")) scrolled[l.parentElement.dataset.col] = l.scrollTop;
    // Where each card was on screen (kept to its column's visible part), for the move animation
    const before = new Map();
    for (const el of board.querySelectorAll(".card[data-step]")) before.set(el.dataset.step, visibleRect(el));
    board.replaceChildren(...COLUMNS.map((c) => {
        const cards = steps.filter((s) => s.col === c.id && (phaseFilter === "all" || s.phase === phaseFilter));
        const col = document.createElement("section");
        col.className = `col s-${c.id}`;
        col.dataset.col = c.id;
        col.innerHTML = `<h2><span class="dot"></span>${c.label}<span class="n">${cards.length}</span></h2><div class="cards"></div>`;
        const list = col.querySelector(".cards");
        if (!cards.length) list.insertAdjacentHTML("beforeend", `<div class="empty">Nothing here</div>`);
        for (const s of cards) list.append(card(s));
        return col;
    }));
    for (const l of board.querySelectorAll(".col .cards")) l.scrollTop = scrolled[l.parentElement.dataset.col] || 0;
    if (moved.size) animateMoves(board, moved, before);
}

// A phase's stretch of time: from the day after the previous phase's last due date (or the project start) to its
// own last due date
function phaseSpan(p, phases, steps, schedule) {
    const last = (id) => {
        const d = steps.filter((s) => s.phase === id && s.due).map((s) => s.due);
        return d.length ? new Date(Math.max(...d)) : null;
    };
    const to = last(p.id);
    if (!to) return null;
    let from = schedule?.start || null;
    for (let i = p.index - 1; i >= 0; i--) {
        const prev = last(phases[i].id);
        if (prev) {
            from = new Date(prev.getTime() + DAY);
            break;
        }
    }
    if (!from) from = new Date(Math.min(...steps.filter((s) => s.phase === p.id && s.due).map((s) => s.due)));
    return { from: from > to ? to : from, to };
}

// The schedule: start → end, today, each phase's stretch, and how much work is done
function renderTimeline(schedule, phases, steps, late) {
    const el = document.getElementById("timeline");
    const dues = steps.map((s) => s.due).filter(Boolean);
    if (!schedule && !dues.length) {
        el.hidden = true;
        return;
    }
    el.hidden = false;
    const start = schedule?.start || new Date(Math.min(...dues));
    const end = schedule?.end || new Date(Math.max(...dues));
    const total = Math.max(1, daysBetween(start, end));
    const pos = (d) => Math.min(100, Math.max(0, (daysBetween(start, d) / total) * 100));
    const now = today();
    const day = daysBetween(start, now) + 1;
    const done = steps.filter((s) => s.col === "done").length;
    const unfinishedLate = late.length;
    const lastDue = dues.length ? new Date(Math.max(...dues)) : null;
    const state = now < start ? `<span class="tl-state">Starts in ${daysBetween(now, start)} d</span>`
        : now > end && done < steps.length ? `<span class="tl-state late">Past the end date</span>`
            : unfinishedLate ? `<span class="tl-state late">${unfinishedLate} overdue</span>`
                : `<span class="tl-state ok">On track</span>`;
    const phaseBars = phases.map((p) => {
        const span = phaseSpan(p, phases, steps, schedule);
        if (!span) return "";
        const left = pos(span.from), right = pos(new Date(span.to.getTime() + DAY));
        return `<div class="tl-phase" style="--phase: ${phaseColor(p.id)}; left: ${left}%; width: ${Math.max(1.5, right - left)}%" title="Phase ${esc(p.id)} · ${esc(p.title)}: ${long(span.from)} → ${long(span.to)}">${esc(p.id)}</div>`;
    }).join("");
    const todayMark = now >= start && now <= end ? `<div class="tl-today" style="left: ${pos(now)}%" title="Today, ${long(now)}"></div>` : "";
    const pct = steps.length ? Math.round((done / steps.length) * 100) : 0;
    el.innerHTML = `<div class="tl-head"><b>Schedule</b>`
        + `<span class="muted">${long(start)} → ${long(end)} · ${total + 1} days${now >= start && now <= end ? ` · day ${day}` : ""}</span>${state}</div>`
        + `<div class="tl-track">${phaseBars}${todayMark}</div>`
        + `<div class="tl-scale"><span>${short(start)}</span>${lastDue && lastDue > end ? `<span style="color: var(--late)">last due ${short(lastDue)}</span>` : ""}<span>${short(end)}</span></div>`
        + `<div class="tl-work"><span>Work done</span><span class="meter"><i style="width: ${pct}%"></i></span><span>${pct}% · ${Math.round(Math.min(100, Math.max(0, ((day - 1) / (total + 1)) * 100)))}% of the time</span></div>`;
}

// A card's place on screen, kept inside its column's visible part (it may be scrolled out of view)
function visibleRect(el) {
    const r = el.getBoundingClientRect();
    const list = el.closest(".cards")?.getBoundingClientRect() ?? r;
    const top = Math.min(Math.max(r.top, list.top), Math.max(list.top, list.bottom - Math.min(r.height, list.height)));
    return { left: r.left, top, width: r.width, height: r.height };
}

// Moved cards fly from their old column to the new one (a floating copy, since columns clip their cards);
// the other cards slide to their new places within their column
function animateMoves(board, moved, before) {
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Bring each moved card into view in its new column first
    for (const n of moved.keys()) {
        const el = board.querySelector(`.card[data-step="${CSS.escape(n)}"]`);
        const list = el?.closest(".cards");
        if (!el || !list) continue;
        const r = el.getBoundingClientRect(), lr = list.getBoundingClientRect();
        if (r.top < lr.top || r.bottom > lr.bottom) list.scrollTop += r.top - lr.top - 8;
    }
    for (const el of board.querySelectorAll(".card[data-step]")) {
        const from = before.get(el.dataset.step);
        if (!from) continue;
        const to = el.getBoundingClientRect();
        if (moved.has(el.dataset.step)) {
            if (still) {
                el.classList.add("arrived");
                continue;
            }
            const ghost = el.cloneNode(true);
            ghost.classList.add("flying");
            Object.assign(ghost.style, { left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px` });
            document.body.append(ghost);
            el.style.visibility = "hidden";
            const dx = to.left - from.left, dy = to.top - from.top;
            const fly = ghost.animate([
                { transform: "translate(0, 0) scale(1)", offset: 0 },
                { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 40}px) scale(1.05)`, offset: 0.5 },
                { transform: `translate(${dx}px, ${dy}px) scale(1)`, offset: 1 },
            ], { duration: 900, easing: "cubic-bezier(.5, 0, .3, 1)", fill: "forwards" });
            fly.onfinish = () => {
                ghost.remove();
                el.style.visibility = "";
                el.classList.add("arrived");
            };
        } else if (!still) {
            const dx = from.left - to.left, dy = from.top - to.top;
            if (Math.abs(dx) + Math.abs(dy) > 1 && Math.abs(dx) < 1) {
                el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 500, easing: "ease-out" });
            }
        }
    }
}

// A short note: how many cards moved, and where to
let toastTimer = 0;
function toast(moved) {
    let el = document.getElementById("toast");
    if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        el.setAttribute("role", "status");
        document.body.append(el);
    }
    const label = (id) => COLUMNS.find((c) => c.id === id)?.label ?? id;
    const n = moved.size;
    el.innerHTML = `<b>${n} task${n === 1 ? "" : "s"} changed</b>` + [...moved.values()].map((m) =>
        `<span>${esc(m.title)}: ${label(m.from)} → ${label(m.to)}</span>`).join("");
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 5000);
}

function card(s) {
    const el = document.createElement("article");
    el.className = "card";
    el.dataset.step = s.n;
    el.style.setProperty("--phase", phaseColor(s.phase));
    const partsDone = s.parts.filter((p) => p.col === "done").length;
    let html = `<div class="meta"><span class="chip phase">Phase ${esc(s.phase)}</span><span>Step ${esc(s.n)}</span>`
        + (s.effort ? `<span class="chip" title="Effort">${esc(s.effort)}</span>` : "")
        + (s.parts.length ? `<span>${partsDone}/${s.parts.length} parts</span>` : "") + dueChip(s) + `</div>`
        + `<h3>${md(s.title)}</h3>`
        // (a plain "Done" or "Done 2026-10-23" says nothing the column and the chip don't)
        + (/^done(\s*\(?\d{4}-\d{2}-\d{2}\)?)?$/i.test(s.status.replace(/\*/g, "").trim()) ? "" : `<p class="status">${md(s.status)}</p>`);
    if (s.holdNote) html += `<details><summary>Why on hold</summary><div class="note">${md(s.holdNote.replace(/^Step [A-Z]?\d+ is \*\*on hold\*\*\.\s*/, ""))}</div></details>`;
    if (s.parts.length) {
        html += `<ul class="parts">` + s.parts.map((p) => {
            const late = p.due && p.col !== "done" && p.col !== "hold" && daysBetween(today(), p.due) < 0;
            const due = p.due && p.col !== "done" ? `<span class="pdue${late ? " late" : ""}" title="Due ${long(p.due)}">· ${late ? "overdue " : "due "}${short(p.due)}</span>` : "";
            return `<li class="s-${p.col}"><span class="pdot"></span><span class="pid">${esc(p.id)}</span><span class="ptxt">${md(shorten(p.text))}<span class="pst">${md(p.status)}${due}</span></span></li>`;
        }).join("") + `</ul>`;
    }
    if (s.desc) html += `<details><summary>Details</summary><p class="desc">${md(s.desc)}</p></details>`;
    el.innerHTML = html;
    return el;
}

// The first sentence of a part, so cards stay short
function shorten(t) {
    const m = t.match(/^(.+?[.:])(\s|$)/);
    return m && m[1].length < t.length ? m[1].replace(/[:]$/, "") : t;
}

// Each card's column the last time this project's board was shown on this device
const seenKey = () => `boardSeen:${data?.title || ""}:${ROADMAP}`;
function seenColumns() {
    try { return new Map(Object.entries(JSON.parse(localStorage.getItem(seenKey())) || {})); } catch (e) { return new Map(); }
}

async function load() {
    try {
        const res = await fetch(ROADMAP, { cache: "no-store" });
        if (!res.ok) throw new Error(`${ROADMAP}: ${res.status}`);
        const prev = data;
        data = parse(await res.text());
        // Cards that changed column since the last read, or (on opening the page) since the board was
        // last seen on this device
        const was = prev ? new Map(prev.steps.map((s) => [s.n, s.col])) : seenColumns();
        const moved = new Map();
        for (const s of data.steps) {
            if (was.has(s.n) && was.get(s.n) !== s.col) moved.set(s.n, { title: s.title, from: was.get(s.n), to: s.col });
        }
        if (!prev && moved.size) {
            // Opening the page: show the board as it was last seen, then move the cards
            const fresh = data;
            data = { ...fresh, steps: fresh.steps.map((s) => (moved.has(s.n) ? { ...s, col: moved.get(s.n).from } : s)) };
            render();
            data = fresh;
            await new Promise((r) => setTimeout(r, 700));
        }
        render(moved);
        if (moved.size) toast(moved);
        try { localStorage.setItem(seenKey(), JSON.stringify(Object.fromEntries(data.steps.map((s) => [s.n, s.col])))); } catch (e) { /* storage unavailable */ }
    } catch (err) {
        const file = location.protocol === "file:";
        document.getElementById("board").innerHTML = `<div class="error">Could not read the roadmap (${esc(err.message)}). `
            + (file ? "This page was opened as a file: start it from the project folder with <code>python board/serve.py</code> instead."
                : "Check that ROADMAP.md is in the project folder, one level above <code>board/</code>.") + `</div>`;
    }
}

document.getElementById("refresh").onclick = load;
// Theme: follows the device unless chosen here (remembered on this device)
const THEME_KEY = "boardTheme";
function applyTheme(t) {
    if (t) document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
}
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) { /* storage unavailable */ }
document.getElementById("theme").onclick = () => {
    const dark = document.documentElement.dataset.theme
        ? document.documentElement.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage unavailable */ }
};

load();
// Rereads the roadmap every minute while the board is on screen; not while the tab is hidden,
// and at once when you come back to it
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
